<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Formas · vista previa</title>
<style>html,body{margin:0;background:#0d0a16}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../public/forms.js"></script>
<script>
// Vista previa de las 10 formas de forms.js: mago con su paleta, aura, 3 disparos, orbe/charco y ambiente.
// Parámetros: ?low (calidad baja), ?static (sin animación; usar renderAt(t)), ?zoom=2 (más grande)
(() => {
  'use strict';
  const F = window.ArcanoForms, TAU = Math.PI * 2;
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const CW = 900, CH = 1200, dpr = window.devicePixelRatio || 1;
  cv.width = CW * dpr; cv.height = CH * dpr; cv.style.width = CW + 'px'; cv.style.height = CH + 'px';
  const low = /[?&]low\b/.test(location.search);
  if (/[?&]gray\b/.test(location.search)) cv.style.filter = 'grayscale(1)'; // prueba de daltonismo
  F.bind({ lowQ: () => low });
  const EL = { arcane: { color: '#c77dff' }, fire: { color: '#ff8a3d' }, ice: { color: '#7fe3ff' }, bolt: { color: '#ffe45c' }, poison: { color: '#8dff6a' } };

  // ---- helpers copiados de game.js (bola con volumen, sombra, ojos) ----
  const shade = (hex, amt) => { const n = parseInt(hex.slice(1), 16), t = amt < 0 ? 0 : 255, k = Math.abs(amt); const f = c => Math.round(c + (t - c) * k); return `rgb(${f(n >> 16 & 255)},${f(n >> 8 & 255)},${f(n & 255)})`; };
  const ballCache = new Map();
  function ballGrad(col, r) { const key = col + '|' + r; let g = ballCache.get(key); if (!g) { g = ctx.createRadialGradient(-r * 0.35, -r * 0.42, r * 0.08, 0, 0, r); g.addColorStop(0, shade(col, 0.55)); g.addColorStop(0.5, col); g.addColorStop(1, shade(col, -0.4)); ballCache.set(key, g); } return g; }
  function ball(x, y, r, col) { ctx.save(); ctx.translate(x, y); ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fillStyle = ballGrad(col, r); ctx.fill(); ctx.strokeStyle = shade(col, -0.62); ctx.lineWidth = 2; ctx.stroke(); ctx.restore(); }
  function blob(x, y, rx, ry, col) { const r = Math.max(rx, ry); ctx.save(); ctx.translate(x, y); ctx.scale(rx / r, ry / r); ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fillStyle = ballGrad(col, r); ctx.fill(); ctx.strokeStyle = shade(col, -0.6); ctx.lineWidth = 2 * r / Math.max(rx, ry); ctx.stroke(); ctx.restore(); }
  const circle = (x, y, r, fill) => { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = fill; ctx.fill(); };
  function eyes(x, y, a, spread, size, white, pupil) { const px = -Math.sin(a), py = Math.cos(a); for (const s of [-1, 1]) { const ex = x + px * spread * s, ey = y + py * spread * s; circle(ex, ey, size, white); circle(ex + Math.cos(a) * size * 0.4, ey + Math.sin(a) * size * 0.4, size * 0.55, pupil); } }
  function shadow(e) { ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(e.x, e.y + e.r * 0.78, e.r * 1.25, e.r * 0.52, 0, 0, TAU); ctx.fill(); }

  // ---- drawPlayer con la paleta de la forma (así lo integrará game.js) ----
  function drawMage(p, L, t) {
    const x = p.x, y = p.y - (p.lev || 0), a = p.face, r = p.r, lean = 0, wave = Math.sin(t * 2);
    ctx.fillStyle = L.cape; // capa
    ctx.beginPath(); ctx.moveTo(x - r * 0.85, y - r * 0.15);
    ctx.quadraticCurveTo(x - r * 1.2 - wave, y + r * 0.7, x - r * 0.7, y + r * 1.05); ctx.lineTo(x + r * 0.7, y + r * 1.05);
    ctx.quadraticCurveTo(x + r * 1.2 + wave, y + r * 0.7, x + r * 0.85, y - r * 0.15); ctx.closePath(); ctx.fill();
    const hx = x + Math.cos(a + 0.9) * (r - 1), hy = y + Math.sin(a + 0.9) * (r - 1) + 2; // bastón
    const tx = hx + Math.cos(a) * 20, ty = hy + Math.sin(a) * 20 - 8;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#4a2c14'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(hx - Math.cos(a) * 10, hy - Math.sin(a) * 10 + 4); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(hx - Math.cos(a) * 10, hy - Math.sin(a) * 10 + 4); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.lineCap = 'butt';
    blob(x, y + r * 0.2, r * 0.95, r * 0.85, L.robe); // túnica
    F.drawCracks(ctx, x, y, r, L, t);
    ctx.strokeStyle = L.trim; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y + r * 0.2, r * 0.8, 0.35, Math.PI - 0.35); ctx.stroke();
    ball(x, y - r * 0.5, r * 0.66, L.skin); // cabeza
    eyes(x + Math.cos(a) * 3, y - r * 0.42 + Math.sin(a) * 2, a, 3.4, 2.4, L.eyeW, L.eyeP);
    circle(x - r * 0.42, y - r * 0.28, 2, 'rgba(255,120,120,.35)'); circle(x + r * 0.42, y - r * 0.28, 2, 'rgba(255,120,120,.35)');
    const hy0 = y - r * 0.92; // sombrero
    blob(x, hy0, r * 1.15, r * 0.4, L.brim);
    ctx.save(); ctx.translate(x, 0); ctx.fillStyle = F.hatGrad(ctx, L, r);
    ctx.beginPath(); ctx.moveTo(-r * 0.72, hy0 - 1); ctx.lineTo(r * 0.72, hy0 - 1);
    ctx.quadraticCurveTo(4 + lean, hy0 - r * 1.05, 10 + lean * 1.6, hy0 - r * 1.75); ctx.quadraticCurveTo(-1 + lean, hy0 - r * 1.0, -r * 0.72, hy0 - 1);
    ctx.closePath(); ctx.fill(); ctx.strokeStyle = L.hatLine; ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore();
    F.drawBand(ctx, x, hy0, r, L);
    F.drawHatStar(ctx, x + 1, hy0 - r * 0.62, L);
    if (p.crown) F.drawCrown(ctx, x + 10, hy0 - r * 1.75 - 6, p.crown, t);
    F.drawGem(ctx, tx, ty, L, Math.sin(t * 6) * 1.5);
  }

  // ---- casillas ----
  const SKS = { // runas / cartas de ejemplo de cada casilla
    aprendiz: { fire: 1, bolt: 1 }, ignea: { fire: 2, orbs: 1 }, glacial: { ice: 2, ricochet: 1 }, voltaica: { bolt: 2, orbs: 2 }, toxica: { poison: 2, diag: 1 },
    plasma: { fire: 2, bolt: 1, atk: 3 }, aurora: { ice: 1, bolt: 2 }, mortaja: { ice: 1, poison: 2 }, azufre: { fire: 1, poison: 2 }, eclipse: { fire: 2, ice: 1, crit: 2 },
  };
  const AFF = { aprendiz: ['fire', 'bolt'], ignea: ['fire'], glacial: ['ice'], voltaica: ['bolt'], toxica: ['poison'], plasma: ['fire', 'bolt'], aurora: ['bolt', 'ice'], mortaja: ['ice', 'poison'], azufre: ['poison', 'fire'], eclipse: ['fire', 'ice'] };
  const CORE = { aprendiz: [null, null], ignea: ['fire', null], glacial: ['ice', null], voltaica: ['bolt', null], toxica: ['poison', null], plasma: ['fire', 'bolt'], aurora: ['bolt', 'ice'], mortaja: ['ice', 'poison'], azufre: ['poison', 'fire'], eclipse: ['fire', 'ice'] };
  function cellBg(i) {
    ctx.fillStyle = '#1b1530'; ctx.fillRect(0, 0, 200, 200);
    ctx.strokeStyle = 'rgba(255,255,255,.04)'; ctx.lineWidth = 1; // baldosas
    for (let k = 20; k < 200; k += 26.6) { ctx.beginPath(); ctx.moveTo(0, k); ctx.lineTo(200, k); ctx.moveTo(k, 30); ctx.lineTo(k, 200); ctx.stroke(); }
    const g = ctx.createRadialGradient(100, 120, 20, 100, 120, 140); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.45)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 200, 200);
  }
  function label(icon, name, col, sub) {
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    ctx.font = '800 13px "Segoe UI", system-ui, sans-serif'; ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(10,6,20,.9)';
    ctx.strokeText(icon + ' ' + name, 8, 13); ctx.fillStyle = col; ctx.fillText(icon + ' ' + name, 8, 13);
    ctx.font = 'italic 600 8.5px "Segoe UI", system-ui, sans-serif'; ctx.fillStyle = 'rgba(233,227,255,.7)'; ctx.fillText(sub, 8, 27);
  }
  // partículas de ambiente simuladas en el tiempo (sin fricción): sale una cada `every`
  function ambientDemo(id, p, t) {
    const A = F.ambient(id); if (!A) return;
    let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
    const n = Math.ceil(A.life * 1.2 / A.every) + 1, base = Math.floor(t / A.every);
    const normal = [], lighter = [];
    for (let k = 0; k < n; k++) {
      const born = (base - k) * A.every, age = t - born; s = 1 + ((base - k) * 7919 & 0xffff);
      const q = F.spawnAmbient(id, p, rnd); if (age > q.life) continue;
      q.x += q.vx * age; q.y += q.vy * age; q.life -= age; (q.normal ? normal : lighter).push(q);
    }
    F.drawNormalParts(ctx, normal);
    ctx.globalCompositeOperation = 'lighter';
    for (const q of lighter) { const k = Math.max(0, q.life / q.max); ctx.globalAlpha = k; circle(q.x, q.y, q.size * (0.5 + 0.5 * k), q.color); }
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  }

  function formCell(id, t) {
    const FM = F.FORMS[id], sk = SKS[id], aff = AFF[id], [core, second] = CORE[id];
    const p = { x: 62, y: 128, r: 15, face: -0.35, school: aff[0], aff, core, second, form: id, sk, tr: F.traitsFor(core, second, sk), lev: 0 };
    if (id === 'plasma') p.crown = FM.color;
    cellBg();
    // charcos (bajo todo)
    if (id === 'toxica') { const o = F.newPool(140, 165, FM.trait.puddle); o.t = 1.4; o.seed = 3; F.drawPool(ctx, o, t); }
    if (id === 'azufre') { const o = F.newPool(140, 165, FM.trait.puddle); o.t = 2; o.seed = 5; F.drawPool(ctx, o, t); }
    F.drawAura(ctx, p, id, t, id === 'aprendiz' ? 0.9 : 0);
    shadow(p);
    drawMage(p, F.look(id, p, EL), t);
    ambientDemo(id, p, t);
    // orbes guardianes (con las Mezclas Halo / Anillo cuando tocan)
    const mixes = F.activeMixes(sk), mix = { halo: mixes.some(m => m.id === 'halo'), anillo: mixes.some(m => m.id === 'anillo') };
    if (sk.orbs) {
      const n = sk.orbs, R = 44, pts = [];
      for (let i = 0; i < n; i++) { const a = t * 1.6 + i * TAU / n; pts.push([p.x + Math.cos(a) * R, p.y - 4 + Math.sin(a) * R]); }
      if (mix.anillo) for (let i = 0; i < n; i++) { const q = pts[i], w = pts[(i + 1) % n]; F.drawArc(ctx, q[0], q[1], w[0], w[1], t, '#ffe45c', i); }
      for (const q of pts) F.drawOrb(ctx, q[0], q[1], id, t, mix, EL[p.school].color);
    }
    // 3 disparos
    const cols = [EL[p.school].color, aff[1] ? EL[aff[1]].color : null];
    if (id === 'ignea') cols[1] = EL.ice.color; // forma pura con runa de otro elemento: chispa
    const sty = F.shotStyle(id, sk, false, cols, mixes);
    const ang = -0.32, ux = Math.cos(ang), uy = Math.sin(ang);
    [[70, -16], [100, 4], [130, 22]].forEach(([d, off], i) => {
      const a = { x: p.x + ux * d - uy * off, y: p.y - 10 + uy * d + ux * off, vx: ux * 760, vy: uy * 760, sty: i === 2 && id !== 'eclipse' ? F.shotStyle(id, sk, true, cols, mixes) : sty, hit: new Set() };
      F.drawShot(ctx, a, t + i * 0.13);
    });
    // proyectiles secundarios de las Mezclas / rasgos
    if (id === 'glacial') { // Granizo: 2 esquirlas en un salto
      for (const s of [-1, 1]) { const q = 0.61 * s - 0.9; F.drawShot(ctx, { x: 150 + Math.cos(q) * 14, y: 70 + Math.sin(q) * 14, vx: Math.cos(q) * 500, vy: Math.sin(q) * 500, sub: 'hail' }, t); }
    }
    if (id === 'aurora') for (let i = 0; i < 6; i++) { const q = i * TAU / 6 + 0.3; F.drawShot(ctx, { x: 160 + Math.cos(q) * 18, y: 160 + Math.sin(q) * 18, vx: Math.cos(q) * 500, vy: Math.sin(q) * 500, sub: 'shard' }, t); }
    if (id === 'toxica') for (const s of [-1, 1]) { const q = ang + s * 0.95; F.drawShot(ctx, { x: p.x + Math.cos(q) * 60, y: p.y - 10 + Math.sin(q) * 60, vx: Math.cos(q) * 760, vy: Math.sin(q) * 760, sty, kind: 'diag', hit: new Set() }, t); }
    if (id === 'eclipse') { const v = F.vignette('eclipse'); ctx.drawImage(v, 0, 0, 200, 200); }
    label(FM.icon, FM.short, FM.color, FM.trName + ' · ' + FM.line);
  }
  function awakenCell(t, kind) {
    cellBg();
    const ft = kind === 'charge' ? 0.3 + (t * 0.35) % 0.6 : 0.9 + (t * 0.4) % 0.5;
    const id = kind === 'charge' ? 'aprendiz' : 'aurora';
    const p = { x: 100, y: 125, r: 15, face: -0.35, school: 'bolt', aff: kind === 'charge' ? ['fire', 'bolt'] : ['bolt', 'ice'], core: 'bolt', form: id, sk: {}, tr: {} };
    const tl = F.timeline(ft); p.lev = tl.lev;
    if (kind === 'boom') F.drawEclipse(ctx, { t: 3 - (t * 0.8) % 3 }, t);
    ctx.fillStyle = `rgba(5,3,10,${tl.dark})`; ctx.fillRect(0, 0, 200, 200); // oscuridad bajo el mago
    F.drawAura(ctx, p, id, t, 1);
    shadow(p); drawMage(p, F.look(id, p, EL), t);
    F.drawAwaken(ctx, { t: ft, el: kind === 'charge' ? 'fire' : 'ice', st: kind === 'charge' ? 1 : 2, boom: ft >= 0.9 }, p, t);
    label('✨', kind === 'charge' ? 'DESPERTAR · carga' : 'ESTALLIDO + sombras', '#fff1c4', kind === 'charge' ? 'Anillos de la pareja, espiral y levitación' : 'Rayos de la forma y esquirlas de Eclipse');
  }

  function renderAt(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#0d0a16'; ctx.fillRect(0, 0, cv.width, cv.height);
    const cells = F.IDS.concat(['charge', 'boom']);
    F.bind({ W: 200, H: 200 });
    cells.forEach((id, i) => {
      const cx = (i % 3) * 300, cy = Math.floor(i / 3) * 300, S = 1.5;
      ctx.setTransform(dpr * S, 0, 0, dpr * S, dpr * (cx + 1), dpr * (cy + 1));
      ctx.save(); ctx.beginPath(); ctx.rect(0, 0, 198.6, 198.6); ctx.clip();
      if (id === 'charge' || id === 'boom') awakenCell(t, id); else formCell(id, t);
      ctx.restore();
    });
  }
  window.renderAt = renderAt;
  if (!/[?&]static\b/.test(location.search)) { const loop = now => { renderAt(now / 1000); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
  else renderAt(1.3);
})();
</script>
</body>
</html>
